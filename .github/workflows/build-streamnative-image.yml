name: build-streamnative-image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: v3.1.0-rc.1-sn.1
        type: string
      image_tag:
        description: Release image tag
        required: true
        default: v3.1.0-rc.1-sn.1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Compute tags
        id: tags
        run: |
          echo "commit=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "full_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -n "${{ secrets.DOCKER_USER }}" ]; then
            echo "hub-creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "hub-creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            CARGO_PROFILE=release
            GIT_SHA=${{ steps.tags.outputs.full_commit }}
          tags: |
            ghcr.io/mattisonchao/risingwave:${{ inputs.image_tag }}
            ghcr.io/mattisonchao/risingwave:${{ inputs.image_tag }}-${{ steps.tags.outputs.commit }}

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH user/packages/container/risingwave/visibility \
            -f visibility=public || true

      - name: Push to Docker Hub
        if: steps.tags.outputs.hub-creds == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e
          USERNAME="${DOCKERHUB_USERNAME:-$DOCKER_USER}"
          TOKEN="${DOCKERHUB_TOKEN:-$DOCKER_PASSWORD}"
          echo "$TOKEN" | docker login -u "$USERNAME" --password-stdin
          docker buildx imagetools create \
            --tag mattison/risingwave:${{ inputs.image_tag }} \
            --tag mattison/risingwave:${{ inputs.image_tag }}-${{ steps.tags.outputs.commit }} \
            ghcr.io/mattisonchao/risingwave:${{ inputs.image_tag }}-${{ steps.tags.outputs.commit }}

      - name: Report
        run: |
          echo "Source: ${{ inputs.source_ref }} (${{ steps.tags.outputs.full_commit }})"
          echo "GHCR: ghcr.io/mattisonchao/risingwave:${{ inputs.image_tag }}-${{ steps.tags.outputs.commit }}"
          echo "DockerHub: mattison/risingwave:${{ inputs.image_tag }}-${{ steps.tags.outputs.commit }} (hub-creds=${{ steps.tags.outputs.hub-creds }})"
