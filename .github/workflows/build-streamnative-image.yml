name: build-streamnative-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamnative
          fetch-depth: 1

      - name: Compute tags
        id: tags
        run: |
          echo "timestamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -n "${{ secrets.DOCKER_USER }}" ]; then
            echo "hub-creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "hub-creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            CARGO_PROFILE=release
          tags: ghcr.io/mattisonchao/risingwave:streamnative-${{ steps.tags.outputs.commit }}

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH user/packages/container/risingwave/visibility \
            -f visibility=public || true

      - name: Push to Docker Hub
        if: steps.tags.outputs.hub-creds == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e
          USERNAME="${DOCKERHUB_USERNAME:-$DOCKER_USER}"
          TOKEN="${DOCKERHUB_TOKEN:-$DOCKER_PASSWORD}"
          echo "$TOKEN" | docker login -u "$USERNAME" --password-stdin
          docker tag ghcr.io/mattisonchao/risingwave:streamnative-${{ steps.tags.outputs.commit }} \
            mattison/risingwave:${{ steps.tags.outputs.timestamp }}
          docker push mattison/risingwave:${{ steps.tags.outputs.timestamp }}

      - name: Report
        run: |
          echo "GHCR: ghcr.io/mattisonchao/risingwave:streamnative-${{ steps.tags.outputs.commit }}"
          echo "DockerHub: mattison/risingwave:${{ steps.tags.outputs.timestamp }} (hub-creds=${{ steps.tags.outputs.hub-creds }})"
